<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teleobjetivo</title>
<style>
  :root{
    --bg:#000000;
    --glass: rgba(255,255,255,0.07);
    --glass-strong: rgba(255,255,255,0.13);
    --glass-border: rgba(255,255,255,0.16);
    --glass-hi: rgba(255,255,255,0.30);
    --text:#FFFFFF;
    --muted: rgba(255,255,255,0.56);
    --muted-2: rgba(255,255,255,0.34);
    --track: rgba(255,255,255,0.18);
    --fill:#FFFFFF;
    --record:#FF3B30;
    --radius-lg: 26px;
    --radius-md: 16px;
  }
  *{box-sizing:border-box;}
  html{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    padding:44px 20px calc(56px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;
    position:relative;
    overflow-x:hidden;
  }

  /* Resplandor ambiental muy sutil, blanco/gris, con una deriva lenta —
     es lo único que se mueve; le da la sensación "líquida" sin meter color. */
  body::before{
    content:"";
    position:fixed;
    top:-30%;left:50%;
    width:1000px;height:1000px;
    transform:translateX(-50%);
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,0.10), transparent 55%),
      radial-gradient(circle at 65% 65%, rgba(255,255,255,0.05), transparent 60%);
    filter: blur(100px);
    pointer-events:none;
    z-index:0;
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{ transform:translateX(-54%) translateY(0) scale(1); }
    100%{ transform:translateX(-46%) translateY(30px) scale(1.06); }
  }
  @media (prefers-reduced-motion: reduce){
    body::before{ animation:none; }
  }

  .wrap{max-width:640px;width:100%;position:relative;z-index:1;}

  .eyebrow{
    display:flex;align-items:center;gap:8px;
    font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:8px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:#fff;
    flex-shrink:0;
  }
  h1{
    font-size:28px;font-weight:800;letter-spacing:-0.02em;margin:0 0 6px;
    color:var(--text);
  }
  .sub{font-size:13.5px;color:var(--muted);margin:0 0 24px;line-height:1.55;max-width:52ch;}

  /* ---- Material "liquid glass": el mismo tratamiento se reutiliza en el
     panel, las tabs, los botones y el círculo del dropzone. Vidrio
     translúcido, borde fino, un filo de luz arriba y sombra abajo, como si
     tuviera espesor real. ---- */
  .glass{
    background:var(--glass);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%);
    border:1px solid var(--glass-border);
    box-shadow:
      inset 0 1px 0 var(--glass-hi),
      inset 0 -1px 0 rgba(0,0,0,0.35);
  }

  /* Control segmentado */
  .tabs{
    display:flex;gap:4px;margin-bottom:18px;
    border-radius:999px;
    padding:4px;
  }
  .tab{
    flex:1;
    font-family:inherit;
    font-size:13px;font-weight:600;letter-spacing:-0.01em;
    padding:9px 14px;border:none;border-radius:999px;
    cursor:pointer;color:var(--muted);background:transparent;
    transition:background .2s ease, color .2s ease;
  }
  .tab.active{
    background:#fff;
    color:#000;
  }

  .panel{
    border-radius:var(--radius-lg);
    padding:20px;
    box-shadow:
      inset 0 1px 0 var(--glass-hi),
      inset 0 -1px 0 rgba(0,0,0,0.35),
      0 30px 70px -30px rgba(0,0,0,0.85);
    position:relative;
    overflow:hidden;
  }
  /* filo de luz diagonal, típico del "liquid glass": refleja como si
     hubiera una fuente de luz arriba-izquierda */
  .panel::before{
    content:"";
    position:absolute;inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,0.10), transparent 45%);
    pointer-events:none;
  }

  .canvas-holder{
    width:100%;min-height:260px;
    background:#0A0A0A;
    display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius-md);overflow:hidden;position:relative;
    border:1px solid rgba(255,255,255,0.08);
  }
  canvas{max-width:100%;max-height:100%;display:block;}
  video{display:none;}

  .dropzone{padding:56px 24px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;width:100%;}
  .dz-icon{
    width:46px;height:46px;margin:0 auto 14px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    color:var(--text);
  }
  .dz-icon svg{width:20px;height:20px;}
  .dropzone strong{display:block;color:var(--text);font-size:14px;font-weight:600;margin-bottom:4px;letter-spacing:-0.01em;}
  input[type=file]{display:none;}

  .cam-start{padding:56px 24px;text-align:center;}
  .cam-start strong{display:block;color:var(--text);font-size:14px;font-weight:600;margin-bottom:16px;}

  .controls{margin-top:22px;display:flex;flex-direction:column;gap:18px;}
  .row{display:flex;align-items:center;gap:14px;}
  .row label{
    font-size:11px;color:var(--muted);letter-spacing:.02em;
    width:140px;flex-shrink:0;font-weight:500;
  }

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    flex:1;height:4px;border-radius:2px;outline:none;
    background: linear-gradient(to right, var(--fill) 0%, var(--fill) var(--pct,50%), var(--track) var(--pct,50%), var(--track) 100%);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;border-radius:50%;
    background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.4);
    cursor:pointer;
    border:none;
    margin-top:0;
  }
  input[type=range]::-moz-range-thumb{
    width:16px;height:16px;border:none;border-radius:50%;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.5);cursor:pointer;
  }
  input[type=range]::-moz-range-track{background:transparent;}

  .val{font-size:11.5px;color:var(--text);min-width:28px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}

  .btn-row{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;}

  button{
    font-family:inherit;
    font-size:13px;font-weight:600;letter-spacing:-0.01em;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid var(--glass-border);
    border-radius:999px;
    padding:11px 20px;
    cursor:pointer;
    color:var(--text);
    background:var(--glass-strong);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--glass-hi);
    transition:background .15s ease, transform .1s ease, filter .15s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button svg{width:16px;height:16px;flex-shrink:0;}
  button:hover{background:rgba(255,255,255,0.19);}
  button:active{transform:scale(0.97);}
  button:disabled{opacity:.35;cursor:not-allowed;}

  /* acción principal: vidrio blanco opaco, texto negro — el capsule
     "prominente" del lenguaje liquid glass */
  button.primary{
    background:#fff;
    border-color:transparent;
    color:#000;
    box-shadow: 0 10px 24px -10px rgba(255,255,255,0.35);
  }
  button.primary:hover{background:#f2f2f2;}

  /* único color funcional de toda la interfaz: el rojo de grabación,
     igual que el punto de "REC" del propio sistema operativo */
  button.recording{
    background:var(--record);
    border-color:transparent;
    color:#fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
  }
  button.recording svg{animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:.45;}
  }

  button.ghost-icon{padding:11px 14px;}

  .note{font-size:11.5px;color:var(--muted-2);margin-top:14px;line-height:1.6;}

  /* ---- Móvil vertical (retrato) ---- */
  @media (max-width: 560px){
    body{padding:26px 14px calc(44px + env(safe-area-inset-bottom));}
    h1{font-size:23px;}
    .sub{font-size:12.5px;}
    .panel{padding:16px;border-radius:22px;}
    .canvas-holder{min-height:220px;}
    .row{flex-wrap:wrap;}
    .row label{width:100%;margin-bottom:2px;}
    input[type=range]{width:100%;}
    .val{width:100%;text-align:left;}
    .btn-row{flex-direction:column;}
    button{width:100%;padding:14px 16px;font-size:14px;}
  }

  /* ---- Móvil horizontal real (pantalla baja y ancha, típico teléfono
     acostado) — layout de dos columnas: visor a un lado, controles al
     otro. Acotado por altura, no por ancho, para no disparar en desktop. ---- */
  @media (max-height: 480px) and (orientation: landscape){
    body{
      padding:10px calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));
      align-items:stretch;
    }
    body::before{width:700px;height:700px;top:-40%;}
    .wrap{max-width:none;width:100%;height:100%;}
    .eyebrow{display:none;}
    h1{font-size:16px;margin-bottom:2px;}
    .sub{display:none;}
    .tabs{margin-bottom:8px;}
    .tab{padding:7px 10px;font-size:11px;}

    .panel{
      display:flex;flex-direction:row;align-items:stretch;gap:14px;padding:12px;
      height:calc(100vh - 66px);height:calc(100dvh - 66px);
    }
    .canvas-holder{flex:1 1 auto;min-height:0;height:100%;max-width:56%;}
    /* .side agrupa controles + botones + nota en UNA sola columna a la
       derecha del visor, para que el panel solo tenga DOS hijos en fila
       (visor y esta columna) en vez de que cada bloque compita por ancho
       por separado — eso es lo que causaba los sliders cortados. */
    .side{
      flex:1 1 260px;max-width:300px;min-width:0;
      display:flex;flex-direction:column;
      overflow-y:auto;
    }
    .controls{margin-top:0;gap:12px;}
    .row label{width:112px;font-size:10px;}
    .btn-row{flex-direction:column;margin-top:10px;}
    button{padding:9px 12px;font-size:11px;}
    .note{margin-top:8px;font-size:9.5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow"><span class="dot"></span>Efectos en vivo · WebGL</div>
  <h1>Teleobjetivo</h1>
  <p class="sub">Blur atmosférico, aberración cromática radial y curva de contraste tipo S — todo renderizado en tiempo real sobre foto, video o cámara.</p>

  <div class="tabs glass">
    <button class="tab active" data-mode="photo">Foto</button>
    <button class="tab" data-mode="video">Video</button>
    <button class="tab" data-mode="camera">Cámara</button>
  </div>

  <div class="panel glass">
    <div class="canvas-holder" id="canvasHolder">
      <div class="dropzone" id="dropzone">
        <div class="dz-icon glass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16.5V18a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1.5"/><path d="M12 15V4"/><path d="M7 8l5-5 5 5"/></svg>
        </div>
        <strong>Cargar fotografía</strong>
        Arrastra una imagen o toca para elegir un archivo
        <input type="file" id="fileInput" accept="image/*">
      </div>
      <div class="cam-start" id="camStart" style="display:none;">
        <div class="dz-icon glass">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.6a1 1 0 0 0 .86-.5l.9-1.5a1 1 0 0 1 .86-.5h3.56a1 1 0 0 1 .86.5l.9 1.5a1 1 0 0 0 .86.5h2.6A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z"/><circle cx="12" cy="13" r="3.4"/></svg>
        </div>
        <strong>Activar cámara</strong>
        <button id="camStartBtn" class="primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.6a1 1 0 0 0 .86-.5l.9-1.5a1 1 0 0 1 .86-.5h3.56a1 1 0 0 1 .86.5l.9 1.5a1 1 0 0 0 .86.5h2.6A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z"/><circle cx="12" cy="13" r="3.4"/></svg>
          Iniciar cámara
        </button>
      </div>
      <video id="video" playsinline muted></video>
      <canvas id="glcanvas" style="display:none;"></canvas>
    </div>

    <div class="side">
      <div class="controls">
        <div class="row">
          <label>Pixelado / mosaico</label>
          <input type="range" id="pixelSlider" min="0" max="100" value="44" step="1">
          <span class="val" id="pixelVal">44</span>
        </div>
        <div class="row">
          <label>Aberración cromática</label>
          <input type="range" id="caSlider" min="0" max="100" value="89" step="1">
          <span class="val" id="caVal">89</span>
        </div>
        <div class="row">
          <label>Clipping / contraste</label>
          <input type="range" id="contrastSlider" min="0" max="100" value="16" step="1">
          <span class="val" id="contrastVal">16</span>
        </div>
        <div class="row">
          <label>Grano</label>
          <input type="range" id="noiseSlider" min="0" max="100" value="67" step="1">
          <span class="val" id="noiseVal">67</span>
        </div>
      </div>

      <div class="btn-row">
        <button id="photoBtn" class="primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.6a1 1 0 0 0 .86-.5l.9-1.5a1 1 0 0 1 .86-.5h3.56a1 1 0 0 1 .86.5l.9 1.5a1 1 0 0 0 .86.5h2.6A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5v-9Z"/><circle cx="12" cy="13" r="3.4"/></svg>
          Tomar foto
        </button>
        <button id="recordBtn">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="7"/></svg>
          Grabar video
        </button>
        <button id="flipBtn" class="ghost-icon" style="display:none;" title="Girar cámara">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.5M4 13a8 8 0 0 0 14.9 3.5"/><path d="M5 4v4h4"/><path d="M19 20v-4h-4"/></svg>
        </button>
      </div>
      <p class="note" id="note"></p>
    </div>
  </div>
</div>

<script src="main.js"></script>
</body>
</html>
